# 詳細設計/07: db / app の 2 サービス分離。DB とモデルは named volume に永続化。
# repos クローンだけは bind mount (./data:/data)。外部ツール (sunaba 等) が
# ホスト側から ./data/repos/<owner>__<name> を直接読んでコピーするため
# (詳細設計/12、sunaba#532)。named volume だと docker data-root の
# パーミッションで他ユーザーから到達できず、この連携が成立しない。
# ingest は使い捨てのワンショット（profiles: ["ingest"]）。
#
# 認証（詳細設計/09・15）: build_token_provider() が
# App > TokenCommand > PAT > 匿名 の優先順位で選択する。
# app / ingest は**コンテナ内**でトークンを消費するので、keystore には届かない
# （D-Bus session bus が bus オーナー UID しか受け付けない）。したがって
# credential を消費者側に運ぶ2方式のどちらかを使う:
#
#   1. GitHub App 秘密鍵ファイル方式 — GITHUB_APP_ID /
#      GITHUB_APP_PRIVATE_KEY_PATH を docker-compose.override.yml の secrets で
#      読み取り専用マウント。コンテナ内プロセスが自分で mint / 再発行するので
#      ホスト側に可動部が不要（非24h稼働の VM 向け。dev-infra#4 / #5）。
#   2. token-file 橋渡し方式 — ホストの scripts/refresh-token.sh が mcp-token で
#      OS keystore から短命トークンを mint し runtime/github-token に書き続け、
#      コンテナは GITHUB_TOKEN_COMMAND=cat /run/shiori/github-token で読むだけ。
#      **秘密鍵はコンテナにもディスクにも入らない**代わり、更新タイマーが
#      load-bearing になる（常時稼働機向け。issue #150/#188/#198）。
#
# どちらも .env / override で明示設定したときだけ有効になる。無設定なら匿名で、
# 公開リポジトリのみの利用は認証設定なしで動く（README / セットアップ.md の約束）。
# 明示設定したのに動かない場合は静かに匿名へ落ちず RuntimeError で失敗する。
#
# 「コンテナ内から mcp-token で keystore を叩く」経路（旧 McpTokenProvider）は
# 原理的に成立せず、失敗しても警告1行で匿名へ静かに落ちるため撤去した（#188）。
# 選択規則と将来の on-demand mint socket 方式は詳細設計/15 を参照。
#
# 同期は serve のバックグラウンドポーリング（SHIORI_SYNC_INTERVAL_SECONDS）に一本化。
services:
  db:
    build: docker/db
    environment:
      POSTGRES_USER: shiori
      POSTGRES_PASSWORD: shiori
      POSTGRES_DB: shiori
    # ゾンビセッション対策: トランザクション内で長時間応答が無い/TCPが切れた
    # セッションを自動破棄し、advisory lock の占有を防ぐ（issue #167）。
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=300000
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=3
    ports:
      # ホスト上の stdio serve / ingest（セットアップ.md 参照）から接続するため
      # localhost に限定して公開する
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiori -d shiori"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      DATABASE_URL: postgresql://shiori:shiori@db:5432/shiori
      SHIORI_REPOS: ${SHIORI_REPOS:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      SHIORI_SYNC_INTERVAL_SECONDS: ${SHIORI_SYNC_INTERVAL_SECONDS:-0}
      SHIORI_INDEX_BOT_LOGINS: ${SHIORI_INDEX_BOT_LOGINS:-}
      SHIORI_INDEX_CODE: ${SHIORI_INDEX_CODE:-}
      SHIORI_CODE_EXTENSIONS: ${SHIORI_CODE_EXTENSIONS:-}
      SHIORI_CODE_EXCLUDE_GLOBS: ${SHIORI_CODE_EXCLUDE_GLOBS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # token-file 橋渡し方式(scripts/refresh-token.{sh,bat} が発行する
      # runtime/github-token をホスト側で更新し続け、コンテナはそれを
      # cat で読むだけ; issue #150/#188/#198)。**明示 opt-in**: .env で
      # GITHUB_TOKEN_COMMAND=cat /run/shiori/github-token を設定した場合のみ
      # 有効になる。既定(未設定)は空パススルーで、従来どおり
      # mcp-token -> anonymous フォールバック(公開リポは無設定で同期可)。
      # 既定値を cat に固定すると無設定環境で TokenCommandProvider が選ばれ、
      # トークンファイル不在の RuntimeError で全 sync が落ちる退行になる。
      GITHUB_TOKEN_COMMAND: ${GITHUB_TOKEN_COMMAND:-}
    volumes:
      - models:/models   # 埋め込みモデルの重みキャッシュ
      - ./data:/data     # git クローン先 (ホスト可読 bind mount; 詳細設計/12)
      - ./runtime:/run/shiori:ro  # 上記トークンファイルの読み取り専用マウント(issue #198)
    ports:
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # オンデマンドの同期ジョブ。`docker compose run --rm ingest` で実行する。
  # `docker compose up` では起動しない（profiles 指定）。cron からも同コマンド。
  ingest:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    profiles: ["ingest"]
    command: ["python", "-m", "shiori", "ingest"]
    environment:
      DATABASE_URL: postgresql://shiori:shiori@db:5432/shiori
      SHIORI_REPOS: ${SHIORI_REPOS:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      SHIORI_INDEX_BOT_LOGINS: ${SHIORI_INDEX_BOT_LOGINS:-}
      SHIORI_INDEX_CODE: ${SHIORI_INDEX_CODE:-}
      SHIORI_CODE_EXTENSIONS: ${SHIORI_CODE_EXTENSIONS:-}
      SHIORI_CODE_EXCLUDE_GLOBS: ${SHIORI_CODE_EXCLUDE_GLOBS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # app サービスと同じ token-file 橋渡し方式(明示 opt-in; issue #198)。
      GITHUB_TOKEN_COMMAND: ${GITHUB_TOKEN_COMMAND:-}
    volumes:
      - models:/models
      - ./data:/data
      - ./runtime:/run/shiori:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  models:

