# 詳細設計/07: db / app の 2 サービス分離。データとモデルは named volume に永続化。
# ingest は使い捨てのワンショット（profiles: ["ingest"]）。
# 認証: build_token_provider() が App > TokenCommand > PAT > mcp-token > 匿名の
# 優先順位で自動選択する（詳細設計/09）。
# compose デプロイの推奨は GitHub App 秘密鍵ファイル方式（GITHUB_APP_ID /
# GITHUB_APP_PRIVATE_KEY_PATH を docker-compose.override.yml の secrets で
# 読み取り専用マウント。masuda-masuo/dev-infra#4 / #5 で実運用確定済み）。
# mcp-token モデル（McpTokenProvider が mcp-token バイナリを自動解決し短命
# トークンをキャッシュする方式）は OS keystore にホストプロセスとして直接
# 届くネイティブ実行向けであり、コンテナ内からは keystore の D-Bus session
# bus が bus オーナー UID しか受け付けないため mint に失敗し、警告ログ1行の
# まま匿名へ静かにフォールバックする（issue #188）。shiori_status の
# token_provider フィールドで実効 provider を確認できる。
# 選択規則: credential の消費者がホストプロセスなら keystore/mcp-token
# モデル、消費者がコンテナ内なら鍵/トークンを消費者側に運ぶ
# （ファイルマウント or 注入）。
# 同期は serve のバックグラウンドポーリング（SHIORI_SYNC_INTERVAL_SECONDS）に一本化。
services:
  db:
    build: docker/db
    environment:
      POSTGRES_USER: shiori
      POSTGRES_PASSWORD: shiori
      POSTGRES_DB: shiori
    # ゾンビセッション対策: トランザクション内で長時間応答が無い/TCPが切れた
    # セッションを自動破棄し、advisory lock の占有を防ぐ（issue #167）。
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=300000
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=3
    ports:
      # ホスト上の stdio serve / ingest（セットアップ.md 参照）から接続するため
      # localhost に限定して公開する
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiori -d shiori"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      DATABASE_URL: postgresql://shiori:shiori@db:5432/shiori
      SHIORI_REPOS: ${SHIORI_REPOS:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      SHIORI_SYNC_INTERVAL_SECONDS: ${SHIORI_SYNC_INTERVAL_SECONDS:-0}
      SHIORI_INDEX_BOT_LOGINS: ${SHIORI_INDEX_BOT_LOGINS:-}
      SHIORI_INDEX_CODE: ${SHIORI_INDEX_CODE:-}
      SHIORI_CODE_EXTENSIONS: ${SHIORI_CODE_EXTENSIONS:-}
      SHIORI_CODE_EXCLUDE_GLOBS: ${SHIORI_CODE_EXCLUDE_GLOBS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - models:/models   # 埋め込みモデルの重みキャッシュ
      - repos:/data      # git クローン先
    ports:
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # オンデマンドの同期ジョブ。`docker compose run --rm ingest` で実行する。
  # `docker compose up` では起動しない（profiles 指定）。cron からも同コマンド。
  ingest:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    profiles: ["ingest"]
    command: ["python", "-m", "shiori", "ingest"]
    environment:
      DATABASE_URL: postgresql://shiori:shiori@db:5432/shiori
      SHIORI_REPOS: ${SHIORI_REPOS:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      SHIORI_INDEX_BOT_LOGINS: ${SHIORI_INDEX_BOT_LOGINS:-}
      SHIORI_INDEX_CODE: ${SHIORI_INDEX_CODE:-}
      SHIORI_CODE_EXTENSIONS: ${SHIORI_CODE_EXTENSIONS:-}
      SHIORI_CODE_EXCLUDE_GLOBS: ${SHIORI_CODE_EXCLUDE_GLOBS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - models:/models
      - repos:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  models:
  repos:

