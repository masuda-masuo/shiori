# 詳細設計/07: db / app の 2 サービス分離。DB は named volume に永続化。
# 埋め込みモデルはイメージ内蔵（docker/app/Dockerfile でプリダウンロード、
# 起動時は HF_HUB_OFFLINE=1 によりネットワーク問い合わせゼロ。issue #238）。
# repos クローンだけは bind mount (./data:/data)。外部ツール (sunaba 等) が
# ホスト側から ./data/repos/<owner>__<name> を直接読んでコピーするため
# (詳細設計/12、sunaba#532)。named volume だと docker data-root の
# パーミッションで他ユーザーから到達できず、この連携が成立しない。
# ingest は使い捨てのワンショット（profiles: ["ingest"]）。
#
# 認証（詳細設計/09・15）: build_token_provider() が
# TokenSocket > TokenCommand > PAT > 匿名 の優先順位で選択する。
# app / ingest は**コンテナ内**でトークンを消費するので、keystore には届かない
# （D-Bus session bus が bus オーナー UID しか受け付けない）。したがって
# **ホスト側で mint した短命トークンを消費者側に pull する**:
#
#   on-demand mint socket 方式 — ホスト側の systemd socket-activated
#   サービス（mcp-launcher が所有・導入する。shiori 自身はこのユニットを
#   持たない。issue #204 / mcp-launcher#42）が接続ごとにトークンを返す
#   （GITHUB_TOKEN_SOCKET）。pull 型なのでスリープ/復帰による窓が無く、
#   **App 秘密鍵はコンテナにもディスクにも入らない**（詳細設計/15）。
#   **ソケットは必ずディレクトリ単位でマウントする**こと
#   （ファイル単位マウントは inode 固定・root 所有ディレクトリ化という
#   実害があり、いずれもコンテナ再作成まで復旧しない。詳細設計/15）。
#
# 旧「GitHub App 秘密鍵ファイル方式」（GITHUB_APP_PRIVATE_KEY_PATH を secrets で
# コンテナにマウントし、コンテナ内で自前 mint する方式A）は退役した（#243 / EPIC #237）。
# 長命な App 秘密鍵をコンテナとディスクに晒すため。App 鍵はホストの keyring に留まる。
#
# どちらも .env / override で明示設定したときだけ有効になる。無設定なら匿名で、
# 公開リポジトリのみの利用は認証設定なしで動く（README / セットアップ.md の約束）。
# 明示設定したのに動かない場合は静かに匿名へ落ちず RuntimeError で失敗する。
#
# 「コンテナ内から mcp-token で keystore を叩く」経路（旧 McpTokenProvider）は
# 原理的に成立せず、失敗しても警告1行で匿名へ静かに落ちるため撤去した（#188）。
#
# 同期は serve のバックグラウンドポーリング（SHIORI_SYNC_INTERVAL_SECONDS）に一本化。
services:
  db:
    build: docker/db
    environment:
      POSTGRES_USER: shiori
      POSTGRES_PASSWORD: shiori
      POSTGRES_DB: shiori
    # ゾンビセッション対策: トランザクション内で長時間応答が無い/TCPが切れた
    # セッションを自動破棄し、advisory lock の占有を防ぐ（issue #167）。
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=300000
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=3
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=8GB
    ports:
      # ホスト上の stdio serve / ingest（セットアップ.md 参照）から接続するため
      # localhost に限定して公開する
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiori -d shiori"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    image: ghcr.io/masuda-masuo/shiori/app
    pull_policy: missing
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    # env_file: .env で .env.example に記載された設定をすべて届ける
    # （setup.md の手順: cp .env.example .env）。environment: のキーは
    # env_file より優先される。ONNX パスはここ経由でのみ届ける
    # （下記 environment: に ${SHIORI_ONNX_MODEL_PATH:-} を書くと、
    # 未設定時に空文字列に展開され embedding.py の明示的 off-switch と
    # 解釈されて ONNX が常時無効化される。issue #353 の罠）。
    # .env は .gitignore 済みで clone 直後には存在しないので required: false。
    # 無いと `docker compose build` すら通らなくなる。
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://shiori:shiori@db:5432/shiori
      SHIORI_REPOS: ${SHIORI_REPOS:-}
      SHIORI_SYNC_INTERVAL_SECONDS: ${SHIORI_SYNC_INTERVAL_SECONDS:-0}
      SHIORI_INDEX_BOT_LOGINS: ${SHIORI_INDEX_BOT_LOGINS:-}
      SHIORI_INDEX_CODE: ${SHIORI_INDEX_CODE:-}
      SHIORI_DEV_REPOS: ${SHIORI_DEV_REPOS:-}
      SHIORI_CODE_EXTENSIONS: ${SHIORI_CODE_EXTENSIONS:-}
      SHIORI_CODE_EXCLUDE_GLOBS: ${SHIORI_CODE_EXCLUDE_GLOBS:-}
      SHIORI_LOG_LEVEL: ${SHIORI_LOG_LEVEL:-}
      SHIORI_ALLOW_REBUILD: ${SHIORI_ALLOW_REBUILD:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # on-demand mint socket — GITHUB_TOKEN_SOCKET=/run/shiori/mint.sock
      # を .env に書くと TokenSocketProvider が選択される。pull 型なので
      # スリープ/復帰の窓が無い(issue #204)。App 鍵より低優先。未設定なら無効。
      GITHUB_TOKEN_SOCKET: ${GITHUB_TOKEN_SOCKET:-}
      GITHUB_TOKEN_COMMAND: ${GITHUB_TOKEN_COMMAND:-}
    volumes:
      - ./data:/data     # git クローン先 (ホスト可読 bind mount; 詳細設計/12)
      # ONNX INT8 モデル成果物 (scripts/build_onnx_model.py が生成; issue #353)。
      # 未生成なら models/ は空 -- Embedder は ONNX 不在として ST にフォールバックする。
      # /models 全体ではなく onnx サブディレクトリだけを bind する。app イメージは
      # HF_HOME=/models にモデルキャッシュを焼き込んでおり (#238)、全体マウントは
      # それを空のホスト dir で隠して埋め込み初期化を壊す（2026-07-28 の実障害）。
      - ./models/onnx:/models/onnx:ro
      # mint socket はディレクトリごとマウントする(ファイル単位はNG; 詳細設計/15)。
      # SHIORI_MINT_SOCKET_DIR は dev-infra 等が override で差し替える想定。
      - ${SHIORI_MINT_SOCKET_DIR:-${XDG_RUNTIME_DIR}/mcp-token}:/run/shiori:rw
    ports:
      - "8765:8765"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # オンデマンドの同期ジョブ。`docker compose run --rm ingest` で実行する。
  # `docker compose up` では起動しない（profiles 指定）。cron からも同コマンド。
  ingest:
    image: ghcr.io/masuda-masuo/shiori/app
    pull_policy: missing
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    profiles: ["ingest"]
    command: ["sh", "-c", "python -m shiori ingest $(echo \"$SHIORI_REPOS\" | tr ',' ' ' | xargs -n1 echo --repo)"]
    # env_file: .env で .env.example に記載された設定をすべて届ける
    # （app サービスと同じ理由。ONNX パスもここ経由。issue #353 の罠回避）。
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://shiori:shiori@db:5432/shiori
      SHIORI_REPOS: ${SHIORI_REPOS:-}
      SHIORI_INDEX_BOT_LOGINS: ${SHIORI_INDEX_BOT_LOGINS:-}
      SHIORI_INDEX_CODE: ${SHIORI_INDEX_CODE:-}
      SHIORI_DEV_REPOS: ${SHIORI_DEV_REPOS:-}
      SHIORI_CODE_EXTENSIONS: ${SHIORI_CODE_EXTENSIONS:-}
      SHIORI_CODE_EXCLUDE_GLOBS: ${SHIORI_CODE_EXCLUDE_GLOBS:-}
      SHIORI_LOG_LEVEL: ${SHIORI_LOG_LEVEL:-}
      SHIORI_BULK_PENDING_THRESHOLD: ${SHIORI_BULK_PENDING_THRESHOLD:-}
      # config.py が防御的にパースするため ${VAR:-} 形式で安全
      # （空文字列・不正値は組み込みデフォルトへフォールバック）。
      SHIORI_FETCH_CONCURRENCY: ${SHIORI_FETCH_CONCURRENCY:-}
      # 1回の index run の作業時間上限（秒）。time.monotonic() 基準なので
      # サスペンド時間は消費しない（issue #377）。空文字列 = 無制限
      # （config.py が防御的に None として扱うため ${VAR:-} 形式で安全）。
      SHIORI_INGEST_TIME_BUDGET: ${SHIORI_INGEST_TIME_BUDGET:-}
      SHIORI_REF_BACKFILL_SINCE: ${SHIORI_REF_BACKFILL_SINCE:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_TOKEN_SOCKET: ${GITHUB_TOKEN_SOCKET:-}
      GITHUB_TOKEN_COMMAND: ${GITHUB_TOKEN_COMMAND:-}
    volumes:
      - ./data:/data
      # CPU 常時稼働レーン向け ONNX INT8 成果物 (issue #353)。GPU overlay は
      # SHIORI_ONNX_MODEL_PATH="" でこの成果物があっても ONNX を明示的に無効化する。
      # /models 全体ではなく onnx サブディレクトリだけを bind する。app イメージは
      # HF_HOME=/models にモデルキャッシュを焼き込んでおり (#238)、全体マウントは
      # それを空のホスト dir で隠して埋め込み初期化を壊す（2026-07-28 の実障害）。
      - ./models/onnx:/models/onnx:ro
      - ${SHIORI_MINT_SOCKET_DIR:-${XDG_RUNTIME_DIR}/mcp-token}:/run/shiori:rw
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:

