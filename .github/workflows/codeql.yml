# CodeQL: advanced setup（issue #428）
# default setup では設定ファイルを読ませられない（オーナーが User なので
# github-codeql-config-file リポジトリプロパティを設定できない）ため、
# ワークフローをリポジトリ内に置いて config-file で除外設定を渡す。
# 言語は default setup と同じ 3 つ（javascript-typescript / python / actions）。
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # リポジトリ既定の GITHUB_TOKEN は read-only なので、解析結果の
    # アップロードに必要な security-events: write をジョブ単位で明示する。
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
