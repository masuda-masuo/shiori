# pytest: ユニットテスト（issue #50 再レビュー指摘）
# GitHub-hosted runner 上でテストを実行する。
# tree-sitter 用の C コンパイラ・ネイティブライブラリは GitHub-hosted runner に
# 無いため、tree-sitter 前提テストは skipif で自動スキップされる。
# これによりフォールバック経路の回帰を検出できる。
name: test

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
      - "scripts/**"
      - "docker-compose.yml"
      - "docker-compose.gpu.yml"
      - "docker/**"
      - ".env.example"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
      - "scripts/**"
      - "docker-compose.yml"
      - "docker-compose.gpu.yml"
      - "docker/**"
      - ".env.example"

# GITHUB_TOKEN を最小権限に固定する。リポジトリ既定は既に read-only だが、
# 明示しておけば既定が変わってもこのワークフローは最小のままになる
# (CodeQL actions/missing-workflow-permissions)。checkout してテストを
# 走らせるだけなので contents: read で足りる。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 3.11の失敗で3.12を巻き添えキャンセルしない（レッグごとに独立して報告する）
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: 依存関係のインストール
        run: |
          pip install -e .[dev]
      - name: pytest の実行
        run: |
          pytest -v --tb=short
