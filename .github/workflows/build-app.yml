# shiori/app イメージを CI ビルドし ghcr.io に push する。
# 事前ビルドされたイメージを sandbox（code-sandbox-mcp 経由等）で直接使うことで、
# 毎回の pip install の重い依存（torch 等）解決を不要にする。
#
# PR では push せずビルドのみ。main への push で push する。
# docker-compose.yml の context: . に合わせ、context はルートディレクトリ。
name: build-app

on:
  push:
    branches: [main]
    paths:
      - "docker/app/Dockerfile"
      - "pyproject.toml"
      - "src/**"
      - "README.md"
      - ".github/workflows/build-app.yml"
  pull_request:
    paths:
      - "docker/app/Dockerfile"
      - "pyproject.toml"
      - "src/**"
      - "README.md"
      - ".github/workflows/build-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/masuda-masuo/shiori/app:latest
            ghcr.io/masuda-masuo/shiori/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
