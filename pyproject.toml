[project]
name = "shiori"
version = "0.1.0"
description = "Local MCP server that indexes GitHub repo knowledge (docs + issue/PR discussions) and serves hybrid search"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # v2 line: mcp >=2.0.0 (mcp.server.fastmcp was removed in 2.0.0, issue #366)
    "mcp>=2.0.0,<3",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "tree-sitter>=0.24,<1.0",
    "tree-sitter-language-pack>=1.12,<2.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
# ONNX Runtime INT8 CPU-inference path (issue #353). Deliberately kept out of
# [embed] and [dev]: it pulls optimum + onnxruntime, which are not needed to
# run the SentenceTransformer fallback or the test suite.
onnx = ["optimum[onnxruntime]>=1.16"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shiori = ["dashboard_dist/**"]

# Note on pyright (#353): the optional [embed]/[onnx] extras
# (sentence-transformers, optimum, onnxruntime, transformers) are absent by
# design in [dev] installs, so their three import sites in
# src/shiori/embedding.py carry inline `# pyright: ignore[reportMissingImports]`
# directives. Inline (not a [tool.pyright] demotion) keeps the suppression
# scoped to exactly those lines -- a typo'd import anywhere else still fails
# the type gate as an error -- and works regardless of the caller's cwd
# (pyright's config-file discovery is cwd-based and not every gate runner
# starts inside the repo).
