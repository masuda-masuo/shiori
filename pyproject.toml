[project]
name = "shiori"
version = "0.1.0"
description = "Local MCP server that indexes GitHub repo knowledge (docs + issue/PR discussions) and serves hybrid search"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pyjwt[crypto]>=2.8",
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-language-pack>=0.9,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
