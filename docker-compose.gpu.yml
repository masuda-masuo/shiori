# GPU 加速用 override。
# nvidia-container-toolkit がインストールされたホストでのみ使用する。
# CPU-only ホストでは本ファイルを指定しないこと。
#
# 使い方:
#   SHIORI_GPU=1 ./scripts/ingest.sh        # ingest.sh が自動で本ファイルを追加
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d  # 明示指定も可
#
# app (常時稼働): deploy.resources.reservations.devices (docker compose up 時に有効)
# ingest (on-demand): runtime: nvidia + deploy.resources.reservations.devices (docker compose run でも有効)

services:
  app:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ingest:
    runtime: nvidia
    # ONNX 明示 off-switch (issue #353): /models に成果物があっても、GPU 稼働時は
    # SentenceTransformer/CUDA を使い続ける。_resolve_onnx_path() は空文字列を
    # 「未設定なので既定パスを探す」ではなく「明示的に無効化」と解釈する。
    environment:
      SHIORI_ONNX_MODEL_PATH: ""
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
