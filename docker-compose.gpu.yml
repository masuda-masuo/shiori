# GPU 加速用 override。
# ingest.sh が自動で本ファイルを追加するのは、両方の前提が揃ったときだけ:
#   - ホストに GPU が見えている (nvidia-smi -L が成功する)
#   - nvidia container toolkit がインストールされている (runtime: nvidia が使える)
# どちらか不明なら CPU のまま実行し、選択と理由を run ログ
# (device=<gpu|cpu> reason="...") に残す。CPU-only ホストでは本ファイルは指定されない。
#
# 明示指定は検知に優先する:
#   SHIORI_GPU=1 ./scripts/ingest.sh        # 検知せず本ファイルを強制追加（toolkit が無いと起動失敗）
#   SHIORI_GPU=0 ./scripts/ingest.sh        # 検知せず CPU 強制
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d  # 明示指定も可
#
# app (常時稼働): deploy.resources.reservations.devices (docker compose up 時に有効)
# ingest (on-demand): runtime: nvidia + deploy.resources.reservations.devices (docker compose run でも有効)

services:
  app:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ingest:
    runtime: nvidia
    # ONNX 明示 off-switch (issue #353): /models に成果物があっても、GPU 稼働時は
    # SentenceTransformer/CUDA を使い続ける。_resolve_onnx_path() は空文字列を
    # 「未設定なので既定パスを探す」ではなく「明示的に無効化」と解釈する。
    environment:
      SHIORI_ONNX_MODEL_PATH: ""
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
